<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Version Check</title>
<style>
  body{background:#111;color:#fff;font-family:monospace;padding:40px;max-width:700px;margin:0 auto}
  .ok{background:#0a2a0a;padding:10px;margin:4px 0;border-radius:4px;border-left:4px solid #22c55e}
  .err{background:#2a0a0a;padding:10px;margin:4px 0;border-radius:4px;border-left:4px solid #ef4444}
</style></head><body>
<h2>🔍 Deploy Version Check</h2>
<div id="out"></div>
<script>
var out = document.getElementById('out');
function row(label, ok, detail) {
  out.innerHTML += '<div class="'+(ok?'ok':'err')+'">'+(ok?'✅':'❌')+' '+label+(detail?' <span style="opacity:0.6;font-size:11px">— '+detail+'</span>':'')+'</div>';
}

Promise.all([
  fetch('/js/firebase.js').then(r=>r.text()),
  fetch('/js/auth.js').then(r=>r.text()),
  fetch('/login.html').then(r=>r.text()),
  fetch('/app.html').then(r=>r.text()),
  fetch('/js/app.js').then(r=>r.text()),
]).then(function(res) {
  var fb=res[0], auth=res[1], login=res[2], appHtml=res[3], appJs=res[4];

  // 1. firebase.js không có reload() trong code thực (chỉ trong comment OK)
  var reloadLines = fb.split('\n').filter(function(l){ return l.includes('location.reload()') && !l.trim().startsWith('//') && !l.trim().startsWith('*'); });
  row('firebase.js: KHÔNG có reload() trong code', reloadLines.length===0, reloadLines.length>0?'Còn '+reloadLines.length+' dòng':'OK');

  // 2. firebase.js có fbPushNow
  row('firebase.js: có fbPushNow', fb.includes('fbPushNow'));

  // 3. auth.js requireAuth dùng overlay
  row('auth.js: requireAuth dùng overlay (không redirect loop)', auth.includes('overlay') || auth.includes('document.body.innerHTML'));

  // 4. app.html là dashboard (không phải login)
  var isLogin = appHtml.includes('switchTab') || appHtml.includes('submitLogin') || appHtml.includes('Đăng nhập tài khoản');
  row('app.html: là dashboard (không phải login)', !isLogin, isLogin?'File sai! Đây là login.html':'OK');

  // 5. app.html load đúng scripts
  var hasAllScripts = ['storage.js','firebase.js','auth.js','app.js','dashboard.js'].every(function(s){ return appHtml.includes(s); });
  row('app.html: load đúng scripts', hasAllScripts);

  // 6. login.html không auto-redirect
  var hasLoop = login.includes("if (existing) { window.location.href = 'app.html'; }");
  row('login.html: không auto-redirect loop', !hasLoop);

  // 7. app.js có nút Push Firebase
  row('app.js: có nút Push Firebase', appJs.includes('Push Firebase') || appJs.includes('fbPushNow'));

  // 8. Guest sign-in anonymous (session 2026-05)
  row('login.html: guest dùng signInAnonymously', login.includes('signInAnonymously'));

  // 9. Firebase badge admin-only
  row('firebase.js: badge admin-only', fb.includes("sess.role === 'admin'") || fb.includes('isAdminNow'));

  // 10. Topbar tag admin-only
  row('app.js: topbar tag admin-only', appJs.includes("user.role === 'admin'") && appJs.includes('topbar-user-tag'));

}).catch(function(e){ row('Lỗi fetch: '+e.message, false); });
</script>
</body></html>
