<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Nghịch Thủy Hàn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Noto+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      overflow: hidden;
    }

    /* Animated background */
    .bg-particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: float linear infinite;
      opacity: 0;
    }
    @keyframes float {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      5%   { opacity: 0.6; }
      95%  { opacity: 0.4; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* Glow lines */
    .bg-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 60%, rgba(240,192,64,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 30%, rgba(64,192,224,0.05) 0%, transparent 70%);
      z-index: 0;
    }

    /* Login card */
    .login-card {
      position: relative;
      z-index: 10;
      width: 420px;
      max-width: 92vw;
      background: rgba(17,17,32,0.92);
      border: 1px solid rgba(240,192,64,0.2);
      border-radius: 16px;
      padding: 40px 36px 36px;
      box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04) inset;
      backdrop-filter: blur(10px);
      animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo-wrap {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 12px rgba(240,192,64,0.5));
      animation: glow 2.5s ease-in-out infinite;
    }
    @keyframes glow {
      0%,100% { filter: drop-shadow(0 0 8px rgba(240,192,64,0.4)); }
      50%      { filter: drop-shadow(0 0 20px rgba(240,192,64,0.8)); }
    }
    .logo-title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 2px;
    }
    .logo-subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      gap: 0;
      background: #0f0f1e;
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.25s;
      border: none;
      background: transparent;
    }
    .auth-tab.active {
      background: var(--bg-card);
      color: var(--accent-gold);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      background: #0f0f1e;
      border: 1px solid #2a2a45;
      color: var(--text-primary);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(240,192,64,0.1);
    }

    /* Password toggle */
    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 42px; }
    .pwd-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      line-height: 1;
    }
    .pwd-toggle:hover { color: var(--text-primary); }

    /* Submit */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--accent-gold);
      color: #111;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin-top: 6px;
      font-family: 'Noto Sans', sans-serif;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    .btn-submit:hover {
      background: #ffd060;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(240,192,64,0.35);
    }
    .btn-submit:active { transform: translateY(0); }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--text-muted);
      font-size: 11px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    /* Guest btn */
    .btn-guest {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border-accent);
      color: var(--text-secondary);
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Noto Sans', sans-serif;
      transition: all 0.2s;
    }
    .btn-guest:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Error msg */
    .error-msg {
      background: rgba(224,64,64,0.12);
      border: 1px solid rgba(224,64,64,0.3);
      color: #ff7070;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* Back to home link */
    .back-home {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .back-home a { color: var(--accent-cyan); }
    .back-home a:hover { color: var(--accent-gold); }

    /* Forgot */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -8px;
      margin-bottom: 12px;
    }
    .forgot-link {
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      text-decoration: underline;
    }
    .forgot-link:hover { color: var(--accent-gold); }

    /* Remember me */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .checkbox-row input[type=checkbox] {
      width: 15px;
      height: 15px;
      accent-color: var(--accent-gold);
    }
    .checkbox-row label { font-size: 13px; color: var(--text-secondary); cursor: pointer; }
  </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-particles" id="particles"></div>

<div class="login-card">
  <div class="logo-wrap">
    <span class="logo-icon">⚔️</span>
    <div class="logo-title">NGHỊCH THỦY HÀN</div>
    <div class="logo-subtitle">Guild Manager</div>
  </div>

  <!-- Tabs -->
  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Đăng nhập</button>
    <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Đăng ký</button>
  </div>

  <!-- Error message -->
  <div class="error-msg" id="error-msg"></div>

  <!-- Login form -->
  <div id="form-login">
    <div class="form-group">
      <label>Tên tài khoản</label>
      <input type="text" id="login-email" placeholder="Tên tài khoản" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <div class="input-wrap">
        <input type="password" id="login-pass" placeholder="Mật khẩu" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')submitLogin()">
        <button class="pwd-toggle" onclick="togglePwd('login-pass', this)" tabindex="-1">👁</button>
      </div>
    </div>
    <div class="forgot-row">
      <span class="forgot-link" onclick="showForgot()">Quên mật khẩu?</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="remember-me">
      <label for="remember-me">Ghi nhớ đăng nhập</label>
    </div>
    <button class="btn-submit" onclick="submitLogin()">Đăng nhập</button>
    <div class="divider">hoặc</div>
    <button class="btn-guest" onclick="loginAsGuest()">👤 Vào xem (Khách)</button>
  </div>

  <!-- Register form -->
  <div id="form-register" style="display:none">
    <div class="form-group">
      <label>Tên đăng nhập</label>
      <input type="text" id="reg-email" placeholder="Tên tài khoản (không cần email)" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Tên hiển thị</label>
      <input type="text" id="reg-name" placeholder="Biệt danh trong bang">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label>Tên Ingame</label>
        <input type="text" id="reg-ingame-name" placeholder="Tên nhân vật">
      </div>
      <div class="form-group">
        <label>ID Ingame</label>
        <input type="text" id="reg-ingame-id" placeholder="ID nhân vật">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label>ID Discord</label>
        <input type="text" id="reg-discord-id" placeholder="username#0000">
      </div>
      <div class="form-group">
        <label>Hệ phái</label>
        <select id="reg-class" style="width:100%;padding:10px 12px;background:#0f0f1e;border:1px solid #2a2a40;border-radius:8px;color:#e8e8f0;font-size:14px;cursor:pointer;outline:none">
          <option value="">-- Chọn hệ phái --</option>
          <option value="toai_mong">⚔ Toái Mộng</option>
          <option value="thiet_y">🛡 Thiết Y</option>
          <option value="huyet_ha">🩸 Huyết Hà</option>
          <option value="than_tuong">⚡ Thần Tướng</option>
          <option value="to_van">🌸 Tố Vấn</option>
          <option value="cuu_linh">🔮 Cửu Linh</option>
          <option value="long_ngam">🐉 Long Ngâm</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <div class="input-wrap">
        <input type="password" id="reg-pass" placeholder="Ít nhất 6 ký tự">
        <button class="pwd-toggle" onclick="togglePwd('reg-pass', this)" tabindex="-1">👁</button>
      </div>
    </div>
    <div class="form-group">
      <label>Xác nhận mật khẩu</label>
      <div class="input-wrap">
        <input type="password" id="reg-pass2" placeholder="Nhập lại mật khẩu"
          onkeydown="if(event.key==='Enter')submitRegister()">
        <button class="pwd-toggle" onclick="togglePwd('reg-pass2', this)" tabindex="-1">👁</button>
      </div>
    </div>
    <button class="btn-submit" onclick="submitRegister()">Tạo tài khoản</button>
  </div>

  <div class="back-home"><a href="index.html">← Về trang chủ</a></div>
</div>


<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  // ── Firebase init cho login.html ───────────────────────────────────────────
  var FB_CFG = {
    apiKey:            "AIzaSyBszK09g8sHvufGNrFwDDgcw6rolV37KSA",
    authDomain:        "nhatmongdata.firebaseapp.com",
    projectId:         "nhatmongdata",
    storageBucket:     "nhatmongdata.firebasestorage.app",
    messagingSenderId: "814787062547",
    appId:             "1:814787062547:web:c4ca571227c5a5555688e6"
  };
  var FAKE_EMAIL_DOMAIN = '@nhatmong.local';

  var _fbApp = null, _fbAuth = null, _fbDb = null, _fbUsersRef = null, _fbMembersRef = null;
  var _fbReady = false;

  function fbLoginInit() {
    if (typeof firebase === 'undefined') { setTimeout(fbLoginInit, 500); return; }
    try {
      _fbApp        = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(FB_CFG);
      _fbAuth       = firebase.auth(_fbApp);
      _fbDb         = firebase.firestore(_fbApp);
      _fbUsersRef   = _fbDb.collection('users');
      _fbMembersRef = _fbDb.collection('guilds').doc('guild_main').collection('members');
      _fbReady      = true;
      console.log('[FB-Login] Ready');
    } catch(e) { console.error('[FB-Login] Init lỗi:', e.message); }
  }
  setTimeout(fbLoginInit, 200);

  function usernameToEmail(username) {
    var u = String(username || '').trim().toLowerCase();
    u = u.replace(/[^a-z0-9._-]/g, '_');
    if (!u) throw new Error('Username không hợp lệ');
    return u + FAKE_EMAIL_DOMAIN;
  }

  // ── Tab switch ─────────────────────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideError() {
    document.getElementById('error-msg').classList.remove('show');
  }

  function togglePwd(inputId, btn) {
    const inp = document.getElementById(inputId);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁';
  }

  const SESSION_KEY = 'nth_session';

  function saveSession(user) {
    const remember = document.getElementById('remember-me')?.checked;
    const store = remember ? localStorage : sessionStorage;
    store.setItem(SESSION_KEY, JSON.stringify({
      id: user.id,
      name: user.name || user.username,
      username: user.username,
      role: user.role
    }));
  }

  // ── Login bằng Firebase Auth ───────────────────────────────────────────────
  function submitLogin() {
    hideError();
    const username = document.getElementById('login-email').value.trim();
    const pass     = document.getElementById('login-pass').value;
    if (!username || !pass) { showError('Vui lòng nhập đầy đủ thông tin!'); return; }

    if (!_fbReady) { showError('Firebase chưa kết nối, vui lòng đợi...'); return; }

    const submitBtn = document.querySelector('#form-login .btn-submit');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Đang đăng nhập...'; }
    function reset() { if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Đăng nhập'; } }

    let email;
    try { email = usernameToEmail(username); }
    catch(e) { reset(); showError('Tên đăng nhập không hợp lệ!'); return; }

    _fbAuth.signInWithEmailAndPassword(email, pass)
      .then(cred => _fbUsersRef.doc(cred.user.uid).get())
      .then(snap => {
        if (!snap.exists) throw new Error('user-doc-missing');
        const user = snap.data();
        saveSession(user);
        window.location.href = 'app.html';
      })
      .catch(err => {
        reset();
        console.error('[Login] error:', err);
        const msg = mapAuthError(err);
        showError(msg);
      });
  }

  function mapAuthError(err) {
    const c = err && err.code;
    if (c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-credential' || c === 'auth/invalid-login-credentials')
      return 'Tên đăng nhập hoặc mật khẩu không đúng!';
    if (c === 'auth/too-many-requests') return 'Quá nhiều lần thử sai. Vui lòng đợi vài phút.';
    if (c === 'auth/network-request-failed') return 'Không kết nối được mạng!';
    if (c === 'auth/email-already-in-use') return 'Tên đăng nhập này đã có người sử dụng!';
    if (c === 'auth/weak-password') return 'Mật khẩu quá yếu (ít nhất 6 ký tự)!';
    if (err.message === 'user-doc-missing') return 'Tài khoản chưa được setup hoàn chỉnh, liên hệ Bang Chủ!';
    return 'Lỗi: ' + (err.message || c);
  }

  // ── Register bằng Firebase Auth ────────────────────────────────────────────
  function submitRegister() {
    hideError();
    const username   = (document.getElementById('reg-email')        || {value:''}).value.trim();
    const name       = (document.getElementById('reg-name')         || {value:''}).value.trim();
    const ingameName = (document.getElementById('reg-ingame-name')  || {value:''}).value.trim();
    const ingameId   = (document.getElementById('reg-ingame-id')    || {value:''}).value.trim();
    const discordId  = (document.getElementById('reg-discord-id')   || {value:''}).value.trim();
    const classId    = (document.getElementById('reg-class')        || {value:''}).value;
    const pass       = (document.getElementById('reg-pass')         || {value:''}).value;
    const pass2      = (document.getElementById('reg-pass2')        || {value:''}).value;

    if (!username)       { showError('Vui lòng nhập tên đăng nhập!'); return; }
    if (!/^[a-zA-Z0-9._-]{3,}$/.test(username)) {
      showError('Tên đăng nhập chỉ chứa chữ, số, dấu chấm/gạch (>= 3 ký tự)!'); return;
    }
    if (!name)           { showError('Vui lòng nhập tên hiển thị!'); return; }
    if (!ingameName)     { showError('Vui lòng nhập tên Ingame!'); return; }
    if (!classId)        { showError('Vui lòng chọn hệ phái!'); return; }
    if (pass.length < 6) { showError('Mật khẩu ít nhất 6 ký tự!'); return; }
    if (pass !== pass2)  { showError('Mật khẩu xác nhận không khớp!'); return; }

    if (!_fbReady) { showError('Firebase chưa kết nối, vui lòng đợi...'); return; }

    const submitBtn = document.querySelector('#form-register .btn-submit');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Đang tạo...'; }
    function reset() { if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Tạo tài khoản'; } }

    let email;
    try { email = usernameToEmail(username); }
    catch(e) { reset(); showError('Tên đăng nhập không hợp lệ!'); return; }

    _fbAuth.createUserWithEmailAndPassword(email, pass)
      .then(cred => {
        const uid = cred.user.uid;
        const userDoc = {
          id: uid,
          username: username,
          name: name,
          role: 'member',
          createdAt: new Date().toISOString()
        };
        const memberDoc = {
          id: uid,
          name: name,
          inGameName: ingameName,
          inGameId:   ingameId,
          discordId:  discordId,
          class:      classId,
          power: 0, combatRole: '', skill: '', tasks: [], group: '', note: '',
          role: 'member',
          joinDate: new Date().toISOString().split('T')[0]
        };
        return Promise.all([
          _fbUsersRef.doc(uid).set(userDoc),
          _fbMembersRef.doc(uid).set(memberDoc)
        ]).then(() => userDoc);
      })
      .then(userDoc => {
        saveSession(userDoc);
        window.location.href = 'app.html';
      })
      .catch(err => {
        reset();
        console.error('[Register] error:', err);
        showError(mapAuthError(err));
      });
  }

  function loginAsGuest() {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
      id: 'guest', name: 'Khách', username: '', role: 'guest'
    }));
    window.location.href = 'app.html';
  }

  function showForgot() {
    alert('Vui lòng liên hệ Bang Chủ để reset mật khẩu.');
  }

  // ── Particles ──────────────────────────────────────────────────────────────
  function spawnParticles() {
    const container = document.getElementById('particles');
    const colors = ['#f0c040', '#40c0e0', '#9060e0', '#30d080'];
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 4 + 2;
      const color = colors[Math.floor(Math.random() * colors.length)];
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        background:${color};
        animation-duration:${Math.random()*15+10}s;
        animation-delay:${Math.random()*10}s;
        opacity:0;
      `;
      container.appendChild(p);
    }
  }
  spawnParticles();

  if (window.location.hash === '#register') switchTab('register');
</script>
</body>
</html>
