<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Nhất Mộng</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #050404;
      overflow: hidden;
      font-family: var(--font-sans);
      color: var(--text-primary);
    }

    /* Vanta.js Background */
    #vanta-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100vw;
      height: 100vh;
    }

    /* Login card - Wooden Plaque / Scroll */
    .login-card {
      position: relative;
      z-index: 10;
      width: 440px;
      max-width: 92vw;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      padding: var(--sp-8);
      box-shadow: var(--glass-shadow);
      animation: cardIn 0.8s var(--ease-out);
      border-radius: var(--r-md);
    }
    
    .login-card::before, .login-card::after {
      content: '';
      position: absolute;
      width: 15px; height: 15px;
      border: 2px solid var(--accent-primary);
    }
    .login-card::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
    .login-card::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo-wrap {
      text-align: center;
      margin-bottom: var(--sp-6);
      position: relative;
    }
    .logo-icon {
      font-size: 40px;
      display: inline-block;
      margin-bottom: var(--sp-2);
      color: var(--accent-primary);
      text-shadow: 0 0 10px rgba(138, 21, 27, 0.5);
    }
    .logo-title {
      font-family: var(--font-display);
      font-size: var(--fs-3xl);
      font-weight: var(--fw-bold);
      color: var(--accent-gold);
      letter-spacing: var(--tr-widest);
      text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
    }
    .logo-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: var(--fs-md);
      color: var(--text-secondary);
      letter-spacing: var(--tr-wide);
      font-style: italic;
      margin-top: var(--sp-1);
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      gap: 0;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-color);
      margin-bottom: var(--sp-6);
    }
    .auth-tab {
      flex: 1;
      padding: var(--sp-3);
      text-align: center;
      font-family: var(--font-display);
      font-size: var(--fs-md);
      font-weight: var(--fw-bold);
      cursor: pointer;
      color: var(--text-secondary);
      transition: all var(--dur-fast) var(--ease-out);
      border: none;
      background: transparent;
      border-bottom: 2px solid transparent;
      letter-spacing: var(--tr-wide);
    }
    .auth-tab.active {
      background: rgba(212, 175, 55, 0.05);
      color: var(--accent-gold);
      border-bottom-color: var(--accent-primary);
      text-shadow: 0 0 5px rgba(212, 175, 55, 0.4);
    }

    /* Form */
    .form-group { margin-bottom: var(--sp-4); }
    .form-group label {
      display: block;
      font-family: var(--font-display);
      font-size: var(--fs-md);
      color: var(--accent-gold);
      margin-bottom: var(--sp-1_5);
      letter-spacing: var(--tr-wide);
      font-weight: var(--fw-bold);
    }
    
    .form-group input, .form-group select {
      width: 100%;
      padding: var(--sp-3) var(--sp-4);
      background: #0f0d0c;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: var(--fs-md);
      outline: none;
      transition: all var(--dur-fast) var(--ease-out);
      font-family: var(--font-sans);
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    /* Password toggle */
    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 46px; }
    .pwd-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      line-height: 1;
      transition: color 0.2s;
    }
    .pwd-toggle:hover { color: var(--accent-gold); }

    /* Submit */
    .btn-submit {
      width: 100%;
      padding: var(--sp-3_5);
      background: var(--accent-primary);
      color: #fff;
      font-weight: var(--fw-bold);
      font-family: var(--font-display);
      font-size: var(--fs-lg);
      letter-spacing: var(--tr-wider);
      border: 1px solid #ff4d4d;
      cursor: pointer;
      margin-top: var(--sp-2);
      transition: all var(--dur-base) var(--ease-out);
      box-shadow: 0 0 10px rgba(138, 21, 27, 0.4);
    }
    .btn-submit:hover {
      background: var(--accent-primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(138, 21, 27, 0.6);
    }
    .btn-submit:active { transform: translateY(0); }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin: var(--sp-5) 0;
      color: var(--text-secondary);
      font-family: var(--font-display);
      font-size: var(--fs-sm);
      font-weight: var(--fw-bold);
      text-transform: uppercase;
      letter-spacing: var(--tr-wider);
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    /* Guest btn */
    .btn-guest {
      width: 100%;
      padding: var(--sp-3);
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-family: var(--font-display);
      font-size: var(--fs-md);
      font-weight: var(--fw-bold);
      letter-spacing: var(--tr-wide);
      cursor: pointer;
      transition: all var(--dur-base);
    }
    .btn-guest:hover {
      background: rgba(212, 175, 55, 0.1);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    /* Error msg */
    .error-msg {
      background: rgba(138, 21, 27, 0.1);
      border: 1px solid rgba(138, 21, 27, 0.5);
      color: #ff8a8f;
      padding: var(--sp-3);
      font-size: var(--fs-sm);
      margin-bottom: var(--sp-4);
      display: none;
      text-align: center;
      font-weight: var(--fw-medium);
    }
    .error-msg.show { display: block; animation: shake 0.4s ease-in-out; }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* Back to home link */
    .back-home {
      text-align: center;
      margin-top: var(--sp-6);
      font-size: var(--fs-sm);
      font-family: 'Cormorant Garamond', serif;
    }
    .back-home a { color: var(--text-secondary); transition: color 0.2s; font-style: italic; }
    .back-home a:hover { color: var(--accent-gold); }

    /* Forgot */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -8px;
      margin-bottom: var(--sp-3);
    }
    .forgot-link {
      font-size: var(--fs-xs);
      color: var(--text-secondary);
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s;
    }
    .forgot-link:hover { color: var(--accent-gold); }

    /* Remember me */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      margin-bottom: var(--sp-4);
    }
    .checkbox-row input[type=checkbox] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-primary);
      cursor: pointer;
    }
    .checkbox-row label { 
      font-size: var(--fs-sm); 
      color: var(--text-secondary); 
      cursor: pointer; 
    }

    .audio-widget {
      position: fixed;
      bottom: var(--sp-6);
      right: var(--sp-6);
      z-index: 1000;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--accent-gold);
      border-radius: var(--r-full);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-4);
      box-shadow: var(--glass-shadow);
      cursor: pointer;
      transition: all var(--dur-base);
    }
    .audio-widget:hover {
      background: rgba(212, 175, 55, 0.1);
      box-shadow: var(--sh-glow-gold);
    }
    .audio-icon {
      font-size: 20px;
      color: var(--accent-gold);
      animation: spin 4s linear infinite;
      animation-play-state: paused;
    }
    .audio-icon.playing { animation-play-state: running; }
    .audio-text {
      font-family: var(--font-display);
      font-size: var(--fs-sm);
      color: var(--text-secondary);
      font-weight: var(--fw-bold);
      letter-spacing: var(--tr-wider);
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<audio id="bg-music" src="phung thanh do.mp3" loop preload="auto"></audio>

<!-- Background Vanta -->
<div id="vanta-bg"></div>

<!-- Audio Widget -->
<div class="audio-widget" onclick="toggleAudio()">
  <div class="audio-icon" id="audio-icon">♫</div>
  <div class="audio-text" id="audio-text">Phát Nhạc</div>
</div>

<div class="login-card">
  <div class="logo-wrap">
    <span class="logo-icon">NM</span>
    <div class="logo-title">NHẤT MỘNG</div>
    <div class="logo-subtitle">Cổng Định Danh Giang Hồ</div>
  </div>

  <!-- Tabs -->
  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Đăng nhập</button>
    <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Ghi danh mới</button>
  </div>

  <!-- Error message -->
  <div class="error-msg" id="error-msg"></div>

  <!-- Login form -->
  <div id="form-login">
    <div class="form-group">
      <label>Danh tính</label>
      <input type="text" id="login-email" placeholder="Nhập tên tài khoản" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Mật hiệu</label>
      <div class="input-wrap">
        <input type="password" id="login-pass" placeholder="Nhập mật khẩu" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')submitLogin()">
        <button class="pwd-toggle" onclick="togglePwd('login-pass', this)" tabindex="-1">👁</button>
      </div>
    </div>
    <div class="forgot-row">
      <span class="forgot-link" onclick="showForgot()">Quên mật hiệu?</span>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="remember-me">
      <label for="remember-me">Lưu danh tính</label>
    </div>
    <button class="btn-submit" onclick="submitLogin()">Tiến Nhập</button>
    <div class="divider">hoặc</div>
    <button class="btn-guest" onclick="loginAsGuest()">Lãng Khách Vô Danh</button>
  </div>

  <!-- Register form -->
  <div id="form-register" style="display:none">
    <div class="form-group">
      <label>Danh tính (Tên đăng nhập)</label>
      <input type="text" id="reg-email" placeholder="Viết liền không dấu" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Biệt hiệu (Trong bang)</label>
      <input type="text" id="reg-name" placeholder="Tên thường gọi">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label>Tên Ingame</label>
        <input type="text" id="reg-ingame-name" placeholder="Tên nhân vật">
      </div>
      <div class="form-group">
        <label>ID Ingame</label>
        <input type="text" id="reg-ingame-id" placeholder="ID nhân vật">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label>ID Discord</label>
        <input type="text" id="reg-discord-id" placeholder="username#0000">
      </div>
      <div class="form-group">
        <label>Môn phái</label>
        <select id="reg-class">
          <option value="">-- Chọn --</option>
          <option value="toai_mong">⚔ Toái Mộng</option>
          <option value="thiet_y">🛡 Thiết Y</option>
          <option value="huyet_ha">🩸 Huyết Hà</option>
          <option value="than_tuong">⚡ Thần Tướng</option>
          <option value="to_van">🌸 Tố Vấn</option>
          <option value="cuu_linh">🔮 Cửu Linh</option>
          <option value="long_ngam">🐉 Long Ngâm</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Mật hiệu</label>
      <div class="input-wrap">
        <input type="password" id="reg-pass" placeholder="Ít nhất 6 ký tự">
        <button class="pwd-toggle" onclick="togglePwd('reg-pass', this)" tabindex="-1">👁</button>
      </div>
    </div>
    <div class="form-group">
      <label>Xác nhận mật hiệu</label>
      <div class="input-wrap">
        <input type="password" id="reg-pass2" placeholder="Nhập lại mật khẩu"
          onkeydown="if(event.key==='Enter')submitRegister()">
        <button class="pwd-toggle" onclick="togglePwd('reg-pass2', this)" tabindex="-1">👁</button>
      </div>
    </div>
    <button class="btn-submit" onclick="submitRegister()">Ghi Danh Môn Phái</button>
  </div>

  <div class="back-home"><a href="index.html">← Trở về tiền sảnh</a></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Vanta.js Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds2.min.js"></script>

<script>
  // Initialize Vanta.js Background
  document.addEventListener("DOMContentLoaded", function() {
    VANTA.CLOUDS2({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      speed: 2.70,
      texturePath: "https://cdn.jsdelivr.net/npm/vanta@latest/gallery/noise.png"
    });
  });
  // ── Audio Control ────────────────────────────────────────────────────────
  const bgMusic = document.getElementById('bg-music');
  const audioIcon = document.getElementById('audio-icon');
  const audioText = document.getElementById('audio-text');
  let isPlaying = false;

  const wasPlaying = localStorage.getItem('music_playing') === 'true';

  function toggleAudio() {
    if (isPlaying) {
      bgMusic.pause();
      isPlaying = false;
      audioIcon.classList.remove('playing');
      audioText.textContent = "Phát Nhạc";
      localStorage.setItem('music_playing', 'false');
    } else {
      bgMusic.play().then(() => {
        isPlaying = true;
        audioIcon.classList.add('playing');
        audioText.textContent = "Đang Phát";
        localStorage.setItem('music_playing', 'true');
      }).catch(err => console.log("Autoplay blocked:", err));
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    if (wasPlaying) {
      bgMusic.play().then(() => {
        isPlaying = true;
        audioIcon.classList.add('playing');
        audioText.textContent = "Đang Phát";
      }).catch(() => {
        console.log("Autoplay blocked on reload");
      });
    }
  });

  // ── Firebase init cho login.html ───────────────────────────────────────────
  var FB_CFG = {
    apiKey:            "AIzaSyBszK09g8sHvufGNrFwDDgcw6rolV37KSA",
    authDomain:        "nhatmongdata.firebaseapp.com",
    projectId:         "nhatmongdata",
    storageBucket:     "nhatmongdata.firebasestorage.app",
    messagingSenderId: "814787062547",
    appId:             "1:814787062547:web:c4ca571227c5a5555688e6"
  };
  var FAKE_EMAIL_DOMAIN = '@nhatmong.local';

  var _fbApp = null, _fbAuth = null, _fbDb = null, _fbUsersRef = null, _fbMembersRef = null;
  var _fbReady = false;

  function fbLoginInit() {
    if (typeof firebase === 'undefined') { setTimeout(fbLoginInit, 500); return; }
    try {
      _fbApp        = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(FB_CFG);
      _fbAuth       = firebase.auth(_fbApp);
      _fbDb         = firebase.firestore(_fbApp);
      _fbUsersRef   = _fbDb.collection('users');
      _fbMembersRef = _fbDb.collection('guilds').doc('guild_main').collection('members');
      _fbReady      = true;
    } catch(e) { console.error('[FB-Login] Init lỗi:', e.message); }
  }
  setTimeout(fbLoginInit, 200);

  function usernameToEmail(username) {
    var u = String(username || '').trim().toLowerCase();
    u = u.replace(/[^a-z0-9._-]/g, '_');
    if (!u) throw new Error('Username không hợp lệ');
    return u + FAKE_EMAIL_DOMAIN;
  }

  // ── Tab switch ─────────────────────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    hideError();
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideError() {
    document.getElementById('error-msg').classList.remove('show');
  }

  function togglePwd(inputId, btn) {
    const inp = document.getElementById(inputId);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁';
  }

  const SESSION_KEY = 'nth_session';

  function saveSession(user) {
    const remember = document.getElementById('remember-me')?.checked;
    const store = remember ? localStorage : sessionStorage;
    store.setItem(SESSION_KEY, JSON.stringify({
      id: user.id,
      name: user.name || user.username,
      username: user.username,
      role: user.role
    }));
  }

  // ── Login bằng Firebase Auth ───────────────────────────────────────────────
  function submitLogin() {
    hideError();
    const username = document.getElementById('login-email').value.trim();
    const pass     = document.getElementById('login-pass').value;
    if (!username || !pass) { showError('Vui lòng nhập đầy đủ thông tin!'); return; }

    if (!_fbReady) { showError('Hệ thống chưa kết nối, vui lòng đợi...'); return; }

    const submitBtn = document.querySelector('#form-login .btn-submit');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Đang tiến nhập...'; }
    function reset() { if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Tiến Nhập'; } }

    let email;
    try { email = usernameToEmail(username); }
    catch(e) { reset(); showError('Danh tính không hợp lệ!'); return; }

    _fbAuth.signInWithEmailAndPassword(email, pass)
      .then(cred => _fbUsersRef.doc(cred.user.uid).get())
      .then(snap => {
        if (!snap.exists) throw new Error('user-doc-missing');
        const user = snap.data();
        saveSession(user);
        localStorage.setItem('music_playing', 'true');
        window.location.href = 'app.html';
      })
      .catch(err => {
        reset();
        showError(mapAuthError(err));
      });
  }

  function mapAuthError(err) {
    const c = err && err.code;
    if (c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-credential' || c === 'auth/invalid-login-credentials')
      return 'Danh tính hoặc mật hiệu không đúng!';
    if (c === 'auth/too-many-requests') return 'Quá nhiều lần thử sai. Vui lòng đợi vài phút.';
    if (c === 'auth/network-request-failed') return 'Không kết nối được mạng!';
    if (c === 'auth/email-already-in-use') return 'Danh tính này đã có người sử dụng!';
    if (c === 'auth/weak-password') return 'Mật hiệu quá yếu (ít nhất 6 ký tự)!';
    if (err.message === 'user-doc-missing') return 'Tài khoản chưa hoàn chỉnh, liên hệ Bang Chủ!';
    return 'Lỗi: ' + (err.message || c);
  }

  // ── Register bằng Firebase Auth ────────────────────────────────────────────
  function submitRegister() {
    hideError();
    const username   = (document.getElementById('reg-email')        || {value:''}).value.trim();
    const name       = (document.getElementById('reg-name')         || {value:''}).value.trim();
    const ingameName = (document.getElementById('reg-ingame-name')  || {value:''}).value.trim();
    const ingameId   = (document.getElementById('reg-ingame-id')    || {value:''}).value.trim();
    const discordId  = (document.getElementById('reg-discord-id')   || {value:''}).value.trim();
    const classId    = (document.getElementById('reg-class')        || {value:''}).value;
    const pass       = (document.getElementById('reg-pass')         || {value:''}).value;
    const pass2      = (document.getElementById('reg-pass2')        || {value:''}).value;

    if (!username)       { showError('Vui lòng nhập danh tính!'); return; }
    if (!/^[a-zA-Z0-9._-]{3,}$/.test(username)) {
      showError('Danh tính chỉ chứa chữ, số, dấu (>= 3 ký tự)!'); return;
    }
    if (!name)           { showError('Vui lòng nhập biệt hiệu!'); return; }
    if (!ingameName)     { showError('Vui lòng nhập tên Ingame!'); return; }
    if (!ingameId)       { showError('Vui lòng nhập ID Ingame!'); return; }
    if (!discordId)      { showError('Vui lòng nhập ID Discord!'); return; }
    if (!classId)        { showError('Vui lòng chọn môn phái!'); return; }
    if (pass.length < 6) { showError('Mật hiệu ít nhất 6 ký tự!'); return; }
    if (pass !== pass2)  { showError('Mật hiệu xác nhận không khớp!'); return; }

    if (!_fbReady) { showError('Hệ thống chưa kết nối, vui lòng đợi...'); return; }

    const submitBtn = document.querySelector('#form-register .btn-submit');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Đang ghi danh...'; }
    function reset() { if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Ghi Danh Môn Phái'; } }

    let email;
    try { email = usernameToEmail(username); }
    catch(e) { reset(); showError('Danh tính không hợp lệ!'); return; }

    _fbAuth.createUserWithEmailAndPassword(email, pass)
      .then(cred => {
        const uid = cred.user.uid;
        const userDoc = {
          id: uid,
          username: username,
          name: name,
          role: 'member',
          createdAt: new Date().toISOString()
        };
        const memberDoc = {
          id: uid,
          name: name,
          inGameName: ingameName,
          inGameId:   ingameId,
          discordId:  discordId,
          class:      classId,
          power: 0, combatRole: '', skill: '', tasks: [], group: '', note: '',
          role: 'member',
          joinDate: new Date().toISOString().split('T')[0]
        };
        return Promise.all([
          _fbUsersRef.doc(uid).set(userDoc),
          _fbMembersRef.doc(uid).set(memberDoc)
        ]).then(() => userDoc);
      })
      .then(userDoc => {
        saveSession(userDoc);
        localStorage.setItem('music_playing', 'true');
        window.location.href = 'app.html';
      })
      .catch(err => {
        reset();
        showError(mapAuthError(err));
      });
  }

  function loginAsGuest() {
    if (!_fbReady) {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        id: 'guest', name: 'Khách', username: '', role: 'guest'
      }));
      window.location.href = 'app.html';
      return;
    }

    var btn = document.querySelector('[onclick="loginAsGuest()"]');
    if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; }

    _fbAuth.signInAnonymously()
      .then(function(cred) {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({
          id:        cred.user.uid,
          name:      'Khách',
          username:  '',
          role:      'guest',
          anonymous: true
        }));
        localStorage.setItem('music_playing', 'true');
        window.location.href = 'app.html';
      })
      .catch(function(err) {
        if (btn) { btn.disabled = false; btn.style.opacity = ''; }
        showError('Không thể vào diện khách: ' + (err && err.message || 'lỗi'));
      });
  }

  function showForgot() {
    alert('Vui lòng liên hệ Bang Chủ để khôi phục danh tính.');
  }

  if (window.location.hash === '#register') switchTab('register');
</script>
</body>
</html>
