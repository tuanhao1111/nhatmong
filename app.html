<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nhất Mộng - Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Cinzel:wght@500;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/movies.css"><style>#splash{position:fixed;inset:0;background:var(--bg-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s}#splash .si{font-size:52px;margin-bottom:14px;animation:pulse 1.5s ease-in-out infinite}#splash .st{font-family:'Cinzel',serif;font-size:22px;color:var(--accent-gold);letter-spacing:3px;margin-bottom:6px}#splash .ss{font-size:12px;color:var(--text-secondary);letter-spacing:2px}#splash .sb{width:180px;height:3px;background:var(--border-color);border-radius:2px;margin-top:24px;overflow:hidden}#splash .sbf{height:100%;background:linear-gradient(90deg,var(--accent-gold),#c0392b);animation:ld 1.2s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes ld{0%{width:0}100%{width:100%}}</style></head><body><div id="splash"><div class="si">⚔️</div><div class="st">NHẤT MỘNG</div><div class="ss">Đang tải...</div><div class="sb"><div class="sbf"></div></div></div><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><script src="js/storage.js"></script><script src="js/firebase.js"></script><script src="js/auth.js"></script><script src="js/utils.js"></script><script src="js/dashboard.js"></script><script src="js/members.js"></script><script src="js/sessions.js"></script><script src="js/settings.js"></script><script src="js/tactics.js"></script><script src="js/slot-modal.js"></script><script src="js/dragdrop.js"></script><script src="js/movies.js"></script><script src="js/gacha.js"></script><script src="js/minigames.js"></script><script src="js/app.js"></script><script>window.addEventListener('DOMContentLoaded',function(){setTimeout(function(){var s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(function(){s.remove();},500);}},800);});</script></body></html>
