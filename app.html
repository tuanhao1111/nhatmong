<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0c0c">
  <title>Nhất Mộng — Quản Lý Bang Hội</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Design tokens & base styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/movies.css">

  <style>
    /* SPLASH SCREEN — WUXIA THEME */
    #splash {
      position: fixed;
      inset: 0;
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(138, 21, 27, 0.1), transparent 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: var(--z-splash);
      transition: opacity var(--dur-slower) var(--ease-out);
    }
    
    #splash::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: -1;
    }
    
    #vanta-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100vw;
      height: 100vh;
    }

    #splash .si {
      font-size: 64px;
      margin-bottom: var(--sp-4);
      color: var(--accent-primary);
      text-shadow: 0 0 20px rgba(138, 21, 27, 0.5);
      animation: stampPulse 2s ease-in-out infinite;
    }
    
    #splash .st {
      font-family: var(--font-display);
      font-size: var(--fs-4xl);
      font-weight: var(--fw-bold);
      color: var(--accent-gold);
      letter-spacing: var(--tr-widest);
      margin-bottom: var(--sp-2);
      text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
    }
    
    #splash .ss {
      font-family: 'Cormorant Garamond', serif;
      font-size: var(--fs-lg);
      color: var(--text-secondary);
      letter-spacing: var(--tr-wide);
      font-style: italic;
    }
    
    #splash .sb {
      width: 200px;
      height: 2px;
      background: rgba(212, 175, 55, 0.2);
      margin-top: var(--sp-8);
      position: relative;
      overflow: hidden;
    }
    
    #splash .sbf {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 50%;
      background: var(--accent-primary);
      animation: inkLoad 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 10px rgba(138, 21, 27, 0.8);
    }

    @keyframes stampPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50%      { transform: scale(1.1); opacity: 1; }
    }
    @keyframes inkLoad {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* Audio Widget */
    .audio-widget {
      position: fixed;
      bottom: calc(var(--sp-6) + var(--safe-bottom) + var(--bottom-nav-height)); /* Avoid mobile bottom nav */
      right: var(--sp-6);
      z-index: calc(var(--z-sticky) + 10);
      background: var(--bg-card);
      border: 1px solid var(--accent-gold);
      border-radius: var(--r-full);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-4);
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      cursor: pointer;
      transition: all var(--dur-base);
    }
    .audio-widget:hover {
      background: var(--bg-elevated);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    .audio-icon {
      font-size: 20px;
      color: var(--accent-gold);
      animation: spin 4s linear infinite;
      animation-play-state: paused;
    }
    .audio-icon.playing { animation-play-state: running; }
    .audio-text {
      font-family: var(--font-display);
      font-size: var(--fs-sm);
      color: var(--text-secondary);
      font-weight: var(--fw-bold);
      letter-spacing: var(--tr-wider);
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    @media (min-width: 769px) {
      .audio-widget {
        bottom: var(--sp-6);
      }
    }
  </style>
</head>
<body>

  <!-- Background Music -->
  <audio id="bg-music" src="phung thanh do.mp3" loop preload="auto"></audio>

  <!-- Background Vanta -->
  <div id="vanta-bg"></div>

  <!-- Audio Widget -->
  <div class="audio-widget" onclick="toggleAudio()">
    <div class="audio-icon" id="audio-icon">♫</div>
    <div class="audio-text" id="audio-text">Phát Nhạc</div>
  </div>

  <!-- Splash Screen -->
  <div id="splash">
    <div class="si">NM</div>
    <div class="st">NHẤT MỘNG</div>
    <div class="ss">Đang tiến nhập giang hồ...</div>
    <div class="sb"><div class="sbf"></div></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Vanta.js Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds2.min.js"></script>

  <!-- Video player for movies page -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- App modules (order matters) -->
  <script src="js/storage.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/members.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/tactics.js"></script>
  <script src="js/slot-modal.js"></script>
  <script src="js/dragdrop.js"></script>
  <script src="js/movies.js"></script>
  <script src="js/gacha.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/khopov.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Initialize Vanta.js Background
    document.addEventListener("DOMContentLoaded", function() {
      VANTA.CLOUDS2({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        speed: 2.70,
        texturePath: "https://cdn.jsdelivr.net/npm/vanta@latest/gallery/noise.png"
      });
    });

    // Splash dismissal
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s) {
          s.style.opacity = '0';
          setTimeout(function () { s.remove(); }, 700);
        }
      }, 1200); // Wait a bit longer to show Wuxia vibe
    });

    // Audio Control Logic
    const bgMusic = document.getElementById('bg-music');
    const audioIcon = document.getElementById('audio-icon');
    const audioText = document.getElementById('audio-text');
    let isPlaying = false;

    const wasPlaying = localStorage.getItem('music_playing') === 'true';

    function toggleAudio() {
      if (isPlaying) {
        bgMusic.pause();
        isPlaying = false;
        audioIcon.classList.remove('playing');
        audioText.textContent = "Phát Nhạc";
        localStorage.setItem('music_playing', 'false');
      } else {
        bgMusic.play().then(() => {
          isPlaying = true;
          audioIcon.classList.add('playing');
          audioText.textContent = "Đang Phát";
          localStorage.setItem('music_playing', 'true');
        }).catch(err => console.log("Autoplay blocked:", err));
      }
    }

    // Try autoplay on navigation
    window.addEventListener('DOMContentLoaded', () => {
      if (wasPlaying) {
        bgMusic.play().then(() => {
          isPlaying = true;
          audioIcon.classList.add('playing');
          audioText.textContent = "Đang Phát";
        }).catch(() => {
          console.log("Autoplay blocked on app.html load");
        });
      }
    });
  </script>
</body>
</html>
