<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111110">
  <title>Nhất Mộng — Quản Lý Bang Hội</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Design tokens & base styles -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/movies.css">

  <style>
    /* SPLASH SCREEN — chỉ tồn tại lúc bootstrap, được .remove() sau 800ms */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: var(--z-splash);
      transition: opacity var(--dur-slower) var(--ease-out);
    }
    #splash .si {
      font-size: 56px;
      margin-bottom: var(--sp-3);
      animation: splashPulse 1.5s ease-in-out infinite;
    }
    #splash .st {
      font-family: var(--font-display);
      font-size: var(--fs-2xl);
      color: var(--accent-gold-text);
      letter-spacing: var(--tr-widest);
      margin-bottom: var(--sp-1);
      text-shadow: 0 0 20px rgba(255, 197, 61, 0.3);
    }
    #splash .ss {
      font-size: var(--fs-xs);
      color: var(--text-secondary);
      letter-spacing: var(--tr-widest);
    }
    #splash .sb {
      width: 200px;
      height: 3px;
      background: var(--sand-4);
      border-radius: var(--r-full);
      margin-top: var(--sp-6);
      overflow: hidden;
    }
    #splash .sbf {
      height: 100%;
      background: linear-gradient(
        90deg,
        var(--accent-primary),
        var(--accent-gold),
        var(--accent-primary)
      );
      animation: splashLoad 1.5s ease-in-out infinite;
    }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }
    @keyframes splashLoad {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>

  <!-- Bootstrap splash, removed after JS init -->
  <div id="splash">
    <div class="si">⚔️</div>
    <div class="st">NHẤT MỘNG</div>
    <div class="ss">ĐANG TẢI...</div>
    <div class="sb"><div class="sbf"></div></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Video player for movies page -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- App modules (order matters — keep as before) -->
  <script src="js/storage.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/members.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/tactics.js"></script>
  <script src="js/slot-modal.js"></script>
  <script src="js/dragdrop.js"></script>
  <script src="js/movies.js"></script>
  <script src="js/gacha.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Splash dismissal
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s) {
          s.style.opacity = '0';
          setTimeout(function () { s.remove(); }, 500);
        }
      }, 800);
    });
  </script>
</body>
</html>
