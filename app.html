<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nghịch Thủy Hàn - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Noto+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <style>
    #splash{position:fixed;inset:0;background:var(--bg-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s}
    #splash .si{font-size:52px;margin-bottom:14px;animation:pulse 1.5s ease-in-out infinite}
    #splash .st{font-family:'Cinzel',serif;font-size:22px;color:var(--accent-gold);letter-spacing:3px;margin-bottom:6px}
    #splash .ss{font-size:12px;color:var(--text-secondary);letter-spacing:2px}
    #splash .sb{width:180px;height:3px;background:var(--border-color);border-radius:2px;margin-top:24px;overflow:hidden}
    #splash .sbf{height:100%;background:linear-gradient(90deg,var(--accent-gold),var(--accent-cyan));animation:ld 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    @keyframes ld{0%{width:0}100%{width:100%}}
  </style>
</head>
<body>

<div id="splash">
  <div class="si">⚔️</div>
  <div class="st">NGHỊCH THỦY HÀN</div>
  <div class="ss">Đang tải...</div>
  <div class="sb"><div class="sbf"></div></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- App scripts - đúng thứ tự -->
<script src="js/storage.js"></script>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/members.js"></script>
<script src="js/sessions.js"></script>
<script src="js/settings.js"></script>
<script src="js/tactics.js"></script>
<script src="js/app.js"></script>

<script>
  window.addEventListener('DOMContentLoaded', function() {
    // Ẩn splash
    setTimeout(function() {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function(){ s.remove(); }, 500); }
    }, 800);
  });
</script>

</body>
</html>
