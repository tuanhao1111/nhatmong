<!DOCTYPE html>
<html lang="vi" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phim — Nhất Mộng</title>
  <meta name="description" content="Khu xem phim — duyệt, tìm kiếm và xem phim trực tuyến." />
  <script>document.documentElement.classList.remove('no-js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/phim.css" />
</head>
<body data-lang="vi" class="page-sub">

  <audio id="bg-music" src="phung thanh do.mp3" loop preload="auto"></audio>
  <div id="vanta-bg"></div>
  <canvas id="bg-canvas"></canvas>
  <div class="grain"></div>
  <div class="cursor" id="cursor-dot"></div>
  <div class="cursor cursor--ring" id="cursor-ring"><span class="cursor__label" id="cursor-label"></span></div>

  <!-- Nav -->
  <nav class="nav">
    <a href="index.html" class="nav__brand" data-cursor>NHẤT<b>MỘNG</b></a>
    <div class="nav__right">
      <div class="lang-toggle" id="lang-toggle">
        <button data-set-lang="vi" class="active">VI</button>
        <button data-set-lang="en">EN</button>
      </div>
      <button class="menu-btn" id="menu-btn" data-cursor aria-label="Menu">
        <span></span><span></span><em>Menu</em>
      </button>
    </div>
  </nav>

  <div class="menu-overlay" id="menu-overlay" aria-hidden="true">
    <nav class="menu-nav">
      <a href="index.html" class="menu-link" data-cursor><span class="menu-no">01</span><span data-vi>Trang chủ</span><span data-en>Home</span></a>
      <a href="phim.html" class="menu-link" data-cursor><span class="menu-no">02</span><span data-vi>Xem phim</span><span data-en>Movies</span></a>
      <a href="gacha.html" class="menu-link" data-cursor><span class="menu-no">03</span><span data-vi>Quay thưởng</span><span data-en>Raffle</span></a>
      <a href="index.html#contact" class="menu-link" data-cursor><span class="menu-no">04</span><span data-vi>Liên hệ</span><span data-en>Contact</span></a>
    </nav>
    <div class="menu-foot">
      <a href="https://discord.gg/jnbNkaNZ" target="_blank" rel="noopener" data-cursor>Discord — emancomchua</a>
      <span>© 2026 Nhất Mộng</span>
    </div>
  </div>

  <main class="phim-page">
    <header class="page-head">
      <div class="eyebrow"><span data-vi>Xem phim</span><span data-en>Movies</span> · 02</div>
      <h1 class="page-title" data-split>PHIM</h1>
      <p class="page-sub-text">
        <span data-vi>Kho phim cập nhật liên tục </span>
        <span data-en>Always-fresh movie library </span>
      </p>
    </header>

    <!-- Toolbar -->
    <div class="phim-toolbar">
      <form class="phim-search" id="phim-search">
        <input type="search" id="search-input" placeholder="Tìm phim..." autocomplete="off" />
        <button type="submit" data-cursor aria-label="Search">⌕</button>
      </form>
      <div class="phim-dropdowns">
        <div class="phim-dd">
          <button class="phim-dd__btn" id="dd-cats-btn" type="button" data-cursor aria-expanded="false">
            <span class="phim-dd__cap"><span data-vi>Thể loại</span><span data-en>Genre</span></span>
            <span class="phim-dd__val" id="dd-cats-val"><span data-vi>Mới nhất</span><span data-en>Latest</span></span>
            <span class="phim-dd__caret" aria-hidden="true">▾</span>
          </button>
          <div class="phim-dd__panel"><div class="phim-filters" id="phim-cats"></div></div>
        </div>
        <div class="phim-dd">
          <button class="phim-dd__btn" id="dd-countries-btn" type="button" data-cursor aria-expanded="false">
            <span class="phim-dd__cap"><span data-vi>Quốc gia</span><span data-en>Country</span></span>
            <span class="phim-dd__val" id="dd-countries-val"><span data-vi>Tất cả</span><span data-en>All</span></span>
            <span class="phim-dd__caret" aria-hidden="true">▾</span>
          </button>
          <div class="phim-dd__panel"><div class="phim-filters" id="phim-countries"></div></div>
        </div>
      </div>
    </div>

    <!-- Recently watched -->
    <section class="phim-recent" id="phim-recent" hidden>
      <div class="phim-recent__head">
        <h2 class="phim-recent__title"><span data-vi>Vừa xem</span><span data-en>Recently watched</span></h2>
        <button class="phim-recent__clear" id="phim-recent-clear" data-cursor>
          <span data-vi>Xóa hết</span><span data-en>Clear</span>
        </button>
      </div>
      <div class="phim-recent__row" id="phim-recent-row"></div>
    </section>

    <!-- Grid -->
    <section class="phim-grid-wrap">
      <div class="phim-grid" id="phim-grid"></div>
      <div class="phim-status" id="phim-status"></div>
      <button class="phim-more" id="phim-more" data-cursor hidden>
        <span data-vi>Xem thêm</span><span data-en>Load more</span>
      </button>
    </section>
  </main>

  <!-- Movie modal -->
  <div class="film-modal" id="film-modal" aria-hidden="true">
    <div class="film-modal__backdrop" id="film-backdrop"></div>
    <div class="film-modal__box" id="film-box">
      <button class="film-modal__close" id="film-close" data-cursor aria-label="Close">✕</button>
      <div class="film-modal__content" id="film-content"></div>
    </div>
  </div>

  <!-- Audio widget -->
  <div class="audio-widget" id="audio-widget" data-cursor>
    <span class="eq"><i></i><i></i><i></i></span>
    <span id="audio-label" data-vi>Phát nhạc</span>
    <span id="audio-label-en" data-en>Play music</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="js/site.js"></script>
  <script src="js/phim.js"></script>
</body>
</html>
